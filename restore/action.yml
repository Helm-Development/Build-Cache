name: Helm Build Cache restore
description: Restore a build cache through the Helm build cache service, like actions/cache/restore. Never saves.
author: Helm
inputs:
  path:
    description: Files, directories and wildcard patterns to restore, one per line. Use the same lines as the step that saves.
    required: true
  key:
    description: The key to look up first. 1 to 512 bytes, with no control characters.
    required: true
  restore-keys:
    description: Prefixes to try, in order, when nothing is saved under the exact key, one per line. At most 20.
    required: false
    default: ''
  fail-on-cache-miss:
    description: Fail the step when no entry is found for the key or any restore key.
    required: false
    default: 'false'
  lookup-only:
    description: Only check whether an entry exists; do not download it.
    required: false
    default: 'false'
outputs:
  cache-hit:
    description: '"true" when an entry was found for the exact key, otherwise "false".'
  cache-primary-key:
    description: The key input. Pass it to Helm-Development/Build-Cache/save.
  cache-matched-key:
    description: The key of the entry that was restored. Empty on a miss.
runs:
  using: node24
  main: ../dist/restore-only/index.js
branding:
  icon: archive
  color: blue
